<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="title desc">
  <title id="title">Aither Weather</title>
  <desc id="desc">A clean atmospheric weather mark with a sun, cloud and radar arc.</desc>
  <defs>
    <linearGradient id="sky" x1="16" y1="10" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66D9FF"/>
      <stop offset="0.52" stop-color="#2B8CFF"/>
      <stop offset="1" stop-color="#1652C7"/>
    </linearGradient>
    <linearGradient id="sun" x1="30" y1="18" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4A8"/>
      <stop offset="1" stop-color="#FFC247"/>
    </linearGradient>
    <linearGradient id="cloud" x1="28" y1="48" x2="92" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E7FA"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Deep atmospheric disc -->
  <circle cx="60" cy="60" r="56" fill="url(#sky)"/>

  <!-- Subtle atmosphere/radar rings -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity=".18">
    <circle cx="60" cy="68" r="39" stroke-width="1.5"/>
    <circle cx="60" cy="68" r="29" stroke-width="1"/>
  </g>

  <!-- Sun -->
  <g filter="url(#shadow)">
    <circle cx="47" cy="39" r="17" fill="url(#sun)"/>
    <g stroke="#FFE88A" stroke-width="3" stroke-linecap="round" opacity=".95">
      <path d="M47 15v7M47 56v7M23 39h7M64 39h7M30 22l5 5M59 51l5 5M64 22l-5 5M35 51l-5 5"/>
    </g>
  </g>

  <!-- Main cloud -->
  <g filter="url(#shadow)">
    <path d="M31 81h55c10 0 18-7 18-16 0-8-6-15-14-16-3-10-12-17-23-17-9 0-17 5-21 13-2-1-4-1-7-1-10 0-18 8-18 18 0 10 4 19 10 19Z" fill="url(#cloud)"/>
  </g>

  <!-- Radar sweep / precipitation arc -->
  <g fill="none" stroke="#BFEFFF" stroke-linecap="round">
    <path d="M26 92c18 14 50 14 68 0" stroke-width="4" opacity=".9"/>
    <path d="M36 96c14 7 34 7 48 0" stroke-width="2" opacity=".55"/>
  </g>

  <!-- Small precipitation dots -->
  <g fill="#FFFFFF" opacity=".9">
    <circle cx="38" cy="90" r="2"/>
    <circle cx="60" cy="95" r="2"/>
    <circle cx="82" cy="90" r="2"/>
  </g>

  <!-- Clean edge -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="1"/>
</svg>
